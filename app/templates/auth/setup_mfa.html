{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
  <div class="w-full max-w-md space-y-8 p-8 rounded-xl border bg-card shadow-lg text-center">
    <h2 class="text-2xl font-bold tracking-tight">Multi-Factor Authentication Setup</h2>
    <p class="text-muted-foreground text-sm">
      Scan the QR code below with an authenticator app (e.g., Google Authenticator, Authy) and enter the 6-digit code.
    </p>
    
    <div class="flex justify-center py-4 bg-white rounded-lg p-4 mx-auto w-fit">
      <img src="data:image/png;base64,{{ qr_code }}" alt="MFA QR Code">
    </div>
    
    <div class="space-y-2">
        <p class="text-xs text-muted-foreground font-mono">Manual Secret: {{ secret }}</p>
    </div>

    <form method="POST" class="space-y-4">
      <div class="space-y-2">
        <label for="code" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Verification Code</label>
        <input 
          type="text" 
          id="code" 
          name="code" 
          maxlength="6"
          class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 text-center text-xl tracking-[0.5em]" 
          placeholder="000000"
          required
        >
      </div>
      <button 
        type="submit" 
        class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 w-full"
      >
        Complete Setup
      </button>
    </form>
  </div>
</div>
{% endblock %}
