<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Security Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: "hsl(217.2 32.6% 17.5%)",
            input: "hsl(217.2 32.6% 17.5%)",
            ring: "hsl(212.7 26.8% 83.9%)",
            background: "hsl(222.2 84% 4.9%)",
            foreground: "hsl(210 40% 98%)",
            primary: {
              DEFAULT: "hsl(210 40% 98%)",
              foreground: "hsl(222.2 47.4% 11.2%)",
            },
            secondary: {
              DEFAULT: "hsl(217.2 32.6% 17.5%)",
              foreground: "hsl(210 40% 98%)",
            },
            destructive: {
              DEFAULT: "hsl(0 62.8% 30.6%)",
              foreground: "hsl(210 40% 98%)",
            },
            muted: {
              DEFAULT: "hsl(217.2 32.6% 17.5%)",
              foreground: "hsl(215 20.2% 65.1%)",
            },
            accent: {
              DEFAULT: "hsl(217.2 32.6% 17.5%)",
              foreground: "hsl(210 40% 98%)",
            },
            popover: {
              DEFAULT: "hsl(222.2 84% 4.9%)",
              foreground: "hsl(210 40% 98%)",
            },
            card: {
              DEFAULT: "hsl(222.2 84% 4.9%)",
              foreground: "hsl(210 40% 98%)",
            },
          },
        }
      }
    }
  </script>
</head>
<body class="bg-background text-foreground font-[Inter] antialiased">
  <div class="flex min-h-screen flex-col items-center justify-center p-6 md:p-10">
    <div class="w-full max-w-[400px] space-y-6">
      <div class="flex flex-col space-y-2 text-center">
        <h1 class="text-2xl font-semibold tracking-tight">Welcome back</h1>
        <p class="text-sm text-muted-foreground">
          Enter your credentials to access the SOC dashboard
        </p>
      </div>

      <div class="rounded-xl border bg-card text-card-foreground shadow-sm">
        <form method="post" class="p-6 space-y-4">
          <div class="space-y-2">
            <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70" for="username">
              Username
            </label>
            <input 
              class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50" 
              id="username" 
              name="username" 
              placeholder="admin" 
              required
            >
          </div>
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70" for="password">
                Password
              </label>
            </div>
            <input 
              class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50" 
              id="password" 
              name="password" 
              type="password" 
              placeholder="••••••••"
              required
            >
          </div>
          <button 
            type="submit" 
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 w-full"
          >
            Login
          </button>
        </form>
      </div>
      
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="rounded-lg border border-destructive/50 bg-destructive/10 px-4 py-3 text-sm text-destructive text-center">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <p class="px-8 text-center text-sm text-muted-foreground">
        Need an account? 
        <a class="underline underline-offset-4 hover:text-primary" href="{{ url_for('auth.register') }}">
          Create one
        </a>
      </p>
    </div>
  </div>
</body>
</html>
